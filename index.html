<title>복용 기록</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Pretendard:wght@400;500&display=swap" rel="stylesheet">
<style>
:root {
  --ink: #1C1C1A;
  --ink2: #5F5E5A;
  --ink3: #B4B2A9;
  --ink4: #E8E6E0;
  --paper: #FAFAF8;
  --paper2: #F3F1EB;
  --paper3: #ECEAE4;
  --green: #3B6D11; --green-bg: #EAF3DE; --green-bd: #97C459;
  --amber: #854F0B; --amber-bg: #FAEEDA; --amber-bd: #EF9F27;
  --red: #A32D2D; --red-bg: #FCEBEB; --red-bd: #F09595;
  --blue: #185FA5; --blue-bg: #E6F1FB; --blue-bd: #85B7EB;
  --pink: #72243E; --pink-bg: #FBEAF0; --pink-bd: #ED93B1;
  --brown: #5D4037; --brown-bg: #FFF8E1; --brown-bd: #BCAAA4;
  --tab-h: 56px;
  --safe-bottom: env(safe-area-inset-bottom, 0px);
}

* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

body {
  font-family: 'Pretendard', -apple-system, sans-serif;
  background: var(--paper);
  color: var(--ink);
  font-size: 14px;
  min-height: 100dvh;
  overscroll-behavior: none;
}

/* ── 앱 레이아웃 ── */
.app { display: flex; flex-direction: column; height: 100dvh; max-width: 430px; margin: 0 auto; background: var(--paper); }
.app-body { flex: 1; overflow-y: auto; overflow-x: hidden; -webkit-overflow-scrolling: touch; padding-bottom: calc(var(--tab-h) + var(--safe-bottom) + 16px); }
.section { display: none; }
.section.active { display: block; }

/* ── 탭바 ── */
.tabbar {
  display: flex; height: var(--tab-h);
  border-top: 0.5px solid var(--ink4);
  background: var(--paper);
  padding-bottom: var(--safe-bottom);
  flex-shrink: 0;
}
.tab-btn {
  flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center;
  gap: 3px; background: none; border: none; cursor: pointer;
  font-family: 'Pretendard', sans-serif; color: var(--ink3); font-size: 10px; font-weight: 400;
  transition: color .15s;
}
.tab-btn i { font-size: 20px; }
.tab-btn.active { color: var(--ink); font-weight: 500; }

/* ── 헤더 ── */
.page-header { padding: 20px 20px 0; }
.page-title { font-size: 22px; font-weight: 500; letter-spacing: -.3px; }
.page-sub { font-size: 12px; color: var(--ink2); margin-top: 3px; }

/* ── 날짜 스트립 ── */
.date-strip-wrap { padding: 14px 20px 0; }
.date-strip { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 2px; scroll-snap-type: x mandatory; -ms-overflow-style: none; scrollbar-width: none; }
.date-strip::-webkit-scrollbar { display: none; }
.d-item {
  flex-shrink: 0; width: 44px; text-align: center;
  background: var(--paper); border: 0.5px solid var(--ink4);
  border-radius: 12px; padding: 6px 4px; cursor: pointer;
  scroll-snap-align: center; transition: all .15s;
}
.d-item:active { transform: scale(.96); }
.d-item.on { background: var(--ink); border-color: var(--ink); }
.d-item.on .d-dow, .d-item.on .d-day { color: var(--paper); }
.d-dow { font-size: 10px; color: var(--ink3); }
.d-day { font-size: 15px; font-weight: 500; color: var(--ink); margin-top: 1px; }
.d-dot { width: 4px; height: 4px; border-radius: 50%; background: var(--green); margin: 3px auto 0; }
.d-dot.off { background: transparent; }
.d-item.on .d-dot { background: rgba(255,255,255,.6); }

/* ── 카드 리스트 ── */
.card-section { padding: 12px 20px 0; }
.section-label { font-size: 11px; font-weight: 500; color: var(--ink3); letter-spacing: .4px; text-transform: uppercase; margin-bottom: 6px; }
.card-list { display: flex; flex-direction: column; gap: 6px; }

.ecard {
  background: var(--paper);
  border: 0.5px solid var(--ink4);
  border-radius: 12px;
  padding: 10px 12px;
  display: flex; align-items: flex-start; gap: 10px;
  cursor: pointer; transition: background .12s;
  position: relative;
}
.ecard:active { background: var(--paper2); }
.ecard.is-med { border-color: var(--green-bd); }

.ec-time { font-size: 11px; color: var(--ink3); min-width: 30px; padding-top: 2px; flex-shrink: 0; line-height: 1; }
.ec-bar { width: 2.5px; border-radius: 2px; flex-shrink: 0; align-self: stretch; min-height: 20px; }
.bar-med { background: var(--green); }
.bar-mood { background: var(--amber); }
.bar-caf { background: var(--brown); }
.bar-symptom { background: var(--red); }
.bar-sleep { background: var(--blue); }
.bar-cycle { background: var(--pink); }
.bar-supplement { background: var(--blue); }
.bar-memo { background: var(--ink3); }
.custom-tag-row { display:flex; gap:6px; margin-top:8px; align-items:center; }
.custom-tag-input { flex:1; font-size:13px; padding:6px 10px; }
.add-pill-btn { flex-shrink:0; background:var(--paper2); color:var(--ink2); border-color:var(--ink4); font-size:12px; padding:5px 10px; }
.add-pill-btn:hover { border-color:var(--ink); color:var(--ink); }

.ec-body { flex: 1; min-width: 0; }
.ec-cat { font-size: 10px; color: var(--ink3); margin-bottom: 2px; }
.ec-main { font-size: 13px; font-weight: 500; color: var(--ink); line-height: 1.3; }
.ec-sub { font-size: 11px; color: var(--ink2); margin-top: 2px; }
.ec-elapsed {
  display: inline-flex; align-items: center; gap: 3px;
  font-size: 10px; font-weight: 500;
  background: var(--amber-bg); color: var(--amber);
  border-radius: 10px; padding: 2px 7px; margin-top: 4px;
}
.ec-ref { font-size: 10px; color: var(--ink3); margin-top: 2px; }
.ec-delete { position: absolute; right: 10px; top: 10px; background: none; border: none; color: var(--ink3); font-size: 16px; cursor: pointer; padding: 2px; line-height: 1; display: none; }
.ecard:hover .ec-delete, .ecard.show-del .ec-delete { display: block; }

.empty-state { text-align: center; padding: 48px 20px; color: var(--ink3); }
.empty-state i { font-size: 32px; display: block; margin-bottom: 8px; }
.empty-state p { font-size: 13px; line-height: 1.6; }

/* ── FAB ── */
.fab-wrap { padding: 12px 20px 0; }
.fab {
  display: flex; align-items: center; justify-content: center; gap: 6px;
  width: 100%; background: var(--ink); color: var(--paper);
  border: none; border-radius: 24px; padding: 13px;
  font-family: 'Pretendard', sans-serif; font-size: 14px; font-weight: 500;
  cursor: pointer; transition: opacity .15s;
}
.fab:active { opacity: .8; }
.fab i { font-size: 16px; }

/* ── 달력 ── */
.cal-wrap { padding: 16px 20px 0; }
.cal-nav { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; }
.cal-nav button { background: none; border: none; color: var(--ink2); font-size: 20px; cursor: pointer; padding: 4px 8px; }
.cal-nav-title { font-size: 16px; font-weight: 500; }
.cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 2px; }
.cal-dow { font-size: 10px; color: var(--ink3); text-align: center; padding: 4px 0; }
.cal-day {
  aspect-ratio: 1; display: flex; flex-direction: column; align-items: center; justify-content: center;
  font-size: 13px; border-radius: 8px; cursor: pointer; color: var(--ink);
  transition: background .12s; position: relative;
}
.cal-day:active { background: var(--paper2); }
.cal-day.empty { cursor: default; }
.cal-day.today { background: var(--ink); color: var(--paper); border-radius: 50%; }
.cal-day.selected:not(.today) { border: 1.5px solid var(--ink); border-radius: 50%; }
.cal-day.has-entry::after { content: ''; position: absolute; bottom: 3px; left: 50%; transform: translateX(-50%); width: 4px; height: 4px; border-radius: 50%; background: var(--green); }
.cal-day.today.has-entry::after { background: var(--paper); }
.cal-day.menstrual { background: var(--pink-bg); }
.cal-day.menstrual.today { background: var(--pink); color: var(--paper); }

.cal-detail { margin-top: 16px; border-top: 0.5px solid var(--ink4); padding-top: 12px; }
.cal-detail-label { font-size: 13px; font-weight: 500; margin-bottom: 8px; color: var(--ink); }
.cal-detail-list { display: flex; flex-direction: column; gap: 5px; }

/* ── 분석 ── */
.stats-wrap { padding: 16px 20px 0; display: flex; flex-direction: column; gap: 12px; }
.stat-card { background: var(--paper2); border-radius: 12px; padding: 14px 16px; }
.stat-card-title { font-size: 12px; font-weight: 500; color: var(--ink2); margin-bottom: 8px; }
.stat-num { font-size: 24px; font-weight: 500; color: var(--ink); }
.stat-unit { font-size: 12px; color: var(--ink3); margin-left: 3px; }
.tag-cloud { display: flex; flex-wrap: wrap; gap: 5px; }
.tag { font-size: 11px; padding: 3px 9px; border-radius: 20px; font-weight: 500; }
.tag-med { background: var(--green-bg); color: var(--green); }
.tag-mood { background: var(--amber-bg); color: var(--amber); }
.tag-symptom { background: var(--red-bg); color: var(--red); }
.tag-caf { background: var(--brown-bg); color: var(--brown); }
.tag-cycle { background: var(--pink-bg); color: var(--pink); }
.tag-sleep { background: var(--blue-bg); color: var(--blue); }
.empty-tags { font-size: 12px; color: var(--ink3); }
.chart-bar-wrap { display: flex; flex-direction: column; gap: 6px; }
.chart-row { display: flex; align-items: center; gap: 8px; }
.chart-row-label { font-size: 11px; color: var(--ink2); min-width: 28px; }
.chart-bar-bg { flex: 1; height: 8px; background: var(--paper3); border-radius: 4px; overflow: hidden; }
.chart-bar-fill { height: 100%; border-radius: 4px; background: var(--amber); transition: width .4s; }
.chart-row-val { font-size: 11px; color: var(--ink3); min-width: 16px; text-align: right; }

/* ── 설정 ── */
.setting-section { padding: 16px 20px 0; }
.setting-card { background: var(--paper2); border-radius: 12px; padding: 14px 16px; margin-bottom: 10px; }
.setting-title { font-size: 13px; font-weight: 500; margin-bottom: 10px; }
.med-row { display: flex; align-items: center; gap: 8px; padding: 5px 0; border-bottom: 0.5px solid var(--ink4); }
.med-row:last-of-type { border-bottom: none; }
.med-row span { flex: 1; font-size: 13px; }
.med-row button { background: none; border: none; color: var(--ink3); font-size: 18px; cursor: pointer; line-height: 1; padding: 2px 4px; }
.add-row { display: flex; gap: 8px; margin-top: 8px; }
.add-row input { flex: 1; font-family: 'Pretendard', sans-serif; font-size: 13px; background: var(--paper); border: 0.5px solid var(--ink4); border-radius: 8px; padding: 8px 10px; color: var(--ink); outline: none; }
.add-row input:focus { border-color: var(--ink2); }
.small-btn { background: var(--ink); color: var(--paper); border: none; border-radius: 8px; padding: 8px 12px; font-family: 'Pretendard', sans-serif; font-size: 12px; font-weight: 500; cursor: pointer; white-space: nowrap; }
.cycle-row { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; }
.cycle-row label { font-size: 12px; color: var(--ink2); min-width: 70px; }
.cycle-row input { font-family: 'Pretendard', sans-serif; font-size: 13px; background: var(--paper); border: 0.5px solid var(--ink4); border-radius: 8px; padding: 6px 10px; color: var(--ink); outline: none; flex: 1; }
.backup-btn {
  display: flex; align-items: center; justify-content: center; gap: 6px;
  width: 100%; background: var(--paper); border: 0.5px solid var(--ink4);
  border-radius: 10px; padding: 11px; font-family: 'Pretendard', sans-serif;
  font-size: 13px; color: var(--ink2); cursor: pointer; margin-bottom: 6px; transition: border-color .15s;
}
.backup-btn:hover { border-color: var(--ink2); color: var(--ink); }
.backup-btn i { font-size: 16px; }
.setting-note { font-size: 11px; color: var(--ink3); line-height: 1.5; margin-top: 4px; }
.danger-btn { background: none; border: none; font-family: 'Pretendard', sans-serif; font-size: 12px; color: var(--ink3); cursor: pointer; text-align: center; display: block; width: 100%; padding: 8px; }

/* ── 모달 ── */
.modal-bg {
  display: none; position: fixed; inset: 0;
  background: rgba(28,28,26,.5); z-index: 100;
  align-items: flex-end; justify-content: center;
}
.modal-bg.open { display: flex; }
.modal {
  background: var(--paper); border-radius: 20px 20px 0 0;
  padding: 0 0 calc(20px + var(--safe-bottom));
  width: 100%; max-width: 430px;
  max-height: 88dvh; overflow-y: auto;
}
.modal-handle { width: 36px; height: 4px; background: var(--ink4); border-radius: 2px; margin: 12px auto 0; }
.modal-header { display: flex; align-items: center; justify-content: space-between; padding: 12px 20px 0; }
.modal-title { font-size: 18px; font-weight: 500; }
.modal-close { background: none; border: none; color: var(--ink3); font-size: 22px; cursor: pointer; line-height: 1; padding: 2px; }
.modal-body { padding: 16px 20px 0; }

.field { margin-bottom: 14px; }
.field-label { font-size: 11px; font-weight: 500; color: var(--ink3); letter-spacing: .3px; margin-bottom: 6px; display: block; }
.cat-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
.cat-btn {
  display: flex; flex-direction: column; align-items: center; gap: 3px;
  padding: 8px 4px; border: 0.5px solid var(--ink4); border-radius: 10px;
  background: var(--paper); cursor: pointer; font-family: 'Pretendard', sans-serif;
  font-size: 11px; color: var(--ink2); transition: all .12s;
}
.cat-btn i { font-size: 18px; }
.cat-btn.on { border-color: var(--ink); background: var(--ink); color: var(--paper); }
.time-input { font-family: 'Pretendard', sans-serif; font-size: 15px; font-weight: 500; background: var(--paper2); border: 0.5px solid var(--ink4); border-radius: 10px; padding: 10px 14px; color: var(--ink); outline: none; width: 120px; }
.text-input { font-family: 'Pretendard', sans-serif; font-size: 14px; background: var(--paper2); border: 0.5px solid var(--ink4); border-radius: 10px; padding: 10px 14px; color: var(--ink); outline: none; width: 100%; }
.text-input:focus { border-color: var(--ink2); }
select.text-input { cursor: pointer; }
textarea.text-input { height: 72px; resize: none; }
.pill-grid { display: flex; flex-wrap: wrap; gap: 6px; }
.pill { padding: 5px 12px; border: 0.5px solid var(--ink4); border-radius: 20px; background: var(--paper); font-family: 'Pretendard', sans-serif; font-size: 12px; color: var(--ink2); cursor: pointer; transition: all .12s; }
.pill.on { border-color: var(--ink); background: var(--ink); color: var(--paper); }
.scale-row { display: flex; gap: 6px; }
.scale-btn { width: 36px; height: 36px; border-radius: 50%; border: 0.5px solid var(--ink4); background: var(--paper); font-family: 'Pretendard', sans-serif; font-size: 13px; font-weight: 500; color: var(--ink2); cursor: pointer; transition: all .12s; }
.scale-btn.on { border-color: var(--ink); background: var(--ink); color: var(--paper); }
.cond { display: none; }
.cond.show { display: block; }
.time-row { display: flex; align-items: center; gap: 8px; }
.time-row label { font-size: 12px; color: var(--ink2); min-width: 28px; }
.save-btn {
  width: 100%; background: var(--ink); color: var(--paper); border: none; border-radius: 24px;
  padding: 14px; font-family: 'Pretendard', sans-serif; font-size: 15px; font-weight: 500;
  cursor: pointer; margin-top: 8px; transition: opacity .15s;
}
.save-btn:active { opacity: .8; }
</style>

<div class="app">
  <div class="app-body">

    <!-- 오늘 섹션 -->

<script>
/* ── 상태 ── */
let S = load();
let currentCat = 'med';
let selectedDate = today();
let editDate = today();
let calY, calM;

function load() {
  try { return JSON.parse(localStorage.getItem('rx_tracker_v2')) || def(); } catch(e) { return def(); }
}
function def() { return { entries:{}, meds:['알리톡 10mg','트레노 100mg'], supps:['비타민C','오메가3','마그네슘','비타민D','유산균'], cycleStart:'', cycleLen:28 }; }
function save() { localStorage.setItem('rx_tracker_v2', JSON.stringify(S)); }
function today() { const d=new Date(); return fmt(d); }
function fmt(d) { return d.getFullYear()+'-'+p(d.getMonth()+1)+'-'+p(d.getDate()); }
function p(n) { return n<10?'0'+n:''+n; }
function nowT() { const d=new Date(); return p(d.getHours())+':'+p(d.getMinutes()); }
function toMin(t) { const[h,m]=t.split(':').map(Number); return h*60+m; }
function fmtElapsed(min) {
  if(min<0||min>72*60) return null; // 72시간 초과는 표시 안 함
  const h=Math.floor(min/60), m=min%60;
  if(h===0) return `+${m}분`;
  if(m===0) return `+${h}시간`;
  return `+${h}시간 ${m}분`;
}
function lastMedGroup(entries, idx, dateStr) {
  // 당일에서 가장 최근 약 복용 시각 찾기
  let refTime = null, dayOffset = 0;
  for(let i=idx-1;i>=0;i--){
    if(entries[i].cat==='med'){ refTime=entries[i].time; dayOffset=0; break; }
  }
  // 당일에 없으면 전날~2일전 탐색
  if(!refTime){
    for(let offset=1; offset<=2; offset++){
      const pd=prevDate(dateStr, offset);
      const prev=S.entries[pd]||[];
      for(let i=prev.length-1;i>=0;i--){
        if(prev[i].cat==='med'){ refTime=prev[i].time; dayOffset=offset; break; }
      }
      if(refTime) break;
    }
  }
  if(!refTime) return null;

  // 같은 시각(±1분)에 먹은 약 전체 묶기
  let pool = [];
  if(dayOffset===0){
    pool = entries.filter(e=>e.cat==='med' && Math.abs(toMin(e.time)-toMin(refTime))<=1);
  } else {
    const pd=prevDate(dateStr, dayOffset);
    pool = (S.entries[pd]||[]).filter(e=>e.cat==='med' && Math.abs(toMin(e.time)-toMin(refTime))<=1);
  }
  const names = [...new Set(pool.map(e=>e.medName||'약'))];
  return { time: refTime, names, dayOffset };
}
function prevDate(ds, n){
  const d=new Date(ds+'T00:00:00'); d.setDate(d.getDate()-n); return fmt(d);
}

/* ── 탭 ── */
function switchTab(id, btn) {
  document.querySelectorAll('.section').forEach(s=>s.classList.remove('active'));
  document.querySelectorAll('.tab-btn').forEach(b=>b.classList.remove('active'));
  document.getElementById('sec-'+id).classList.add('active');
  btn.classList.add('active');
  if(id==='home') renderHome();
  if(id==='cal') { initCal(); renderCal(); renderCalDetail(selectedDate); }
  if(id==='stats') renderStats();
  if(id==='setting') renderSetting();
}

/* ── 홈 ── */
function renderHome() {
  const d = new Date();
  const days=['일','월','화','수','목','금','토'];
  const months=['1월','2월','3월','4월','5월','6월','7월','8월','9월','10월','11월','12월'];
  document.getElementById('hdr-date').textContent = months[d.getMonth()]+' '+d.getDate()+'일 '+days[d.getDay()];
  const cl = getCycleLabel(today());
  let sub = d.getFullYear()+'년';
  if(cl) sub += '  ·  ' + cl;
  document.getElementById('hdr-sub').textContent = sub;
  renderStrip();
  renderCards(selectedDate);
}

function renderStrip() {
  const strip = document.getElementById('date-strip');
  strip.innerHTML = '';
  const days=['일','월','화','수','목','금','토'];
  const t = today();
  for(let i=-6; i<=0; i++) {
    const d=new Date(); d.setDate(d.getDate()+i);
    const ds=fmt(d);
    const el=document.createElement('div');
    el.className='d-item'+(ds===selectedDate?' on':'');
    const hasDot = S.entries[ds] && S.entries[ds].length>0;
    el.innerHTML=`<div class="d-dow">${days[d.getDay()]}</div><div class="d-day">${d.getDate()}</div><div class="d-dot${hasDot?'':' off'}"></div>`;
    el.onclick=()=>{ selectedDate=ds; editDate=ds; renderStrip(); renderCards(ds); updateHeader(ds); };
    strip.appendChild(el);
  }
  const last=strip.lastChild;
  if(last) last.scrollIntoView({inline:'end',block:'nearest'});
}

function updateHeader(ds) {
  const d=new Date(ds+'T00:00:00');
  const days=['일','월','화','수','목','금','토'];
  const months=['1월','2월','3월','4월','5월','6월','7월','8월','9월','10월','11월','12월'];
  const isToday = ds===today();
  document.getElementById('hdr-date').textContent = months[d.getMonth()]+' '+d.getDate()+'일 '+days[d.getDay()]+(isToday?' (오늘)':'');
  const cl = getCycleLabel(ds);
  const sub = d.getFullYear()+'년' + (cl ? '  ·  '+cl : '');
  document.getElementById('hdr-sub').textContent = sub;
}

function renderCards(ds) {
  const list = document.getElementById('card-list');
  list.innerHTML='';
  const entries = S.entries[ds]||[];
  if(entries.length===0){
    list.innerHTML=`<div class="empty-state"><i class="ti ti-notes" aria-hidden="true"></i><p>기록이 없어요.<br>아래 버튼으로 추가해보세요.</p></div>`;
    return;
  }
  const catNames={med:'약 복용',symptom:'신체 증상',mood:'감정',caffeine:'카페인',sleep:'수면',cycle:'생리주기',supplement:'영양제',memo:'기타 메모'};
  entries.forEach((e,i)=>{
    const card=document.createElement('div');
    card.className='ecard'+(e.cat==='med'?' is-med':'');
    const ref=lastMedGroup(entries,i,ds);
    let elapsedHtml='';
    if(e.cat!=='med' && e.cat!=='supplement' && ref){
      const diffMin = toMin(e.time) - toMin(ref.time) + ref.dayOffset*24*60;
      const badge=fmtElapsed(diffMin);
      if(badge){
        const dayLabel=ref.dayOffset===1?' (어제 복용)':ref.dayOffset===2?' (2일 전 복용)':'';
        const nameLabel=ref.names.join(' · ');
        elapsedHtml=`<div class="ec-elapsed"><i class="ti ti-clock" style="font-size:11px" aria-hidden="true"></i>${badge} 후${dayLabel}</div><div class="ec-ref">${nameLabel} 기준</div>`;
      }
    }
    card.innerHTML=`
      <div class="ec-time">${e.time}</div>
      <div class="ec-bar bar-${e.cat}"></div>
      <div class="ec-body">
        <div class="ec-cat">${catNames[e.cat]||e.cat}</div>
        <div class="ec-main">${mainLabel(e)}</div>
        ${e.sub||e.note||e.dose?`<div class="ec-sub">${e.sub||e.dose||e.note||''}</div>`:''}
        ${elapsedHtml}
      </div>
      <button class="ec-delete" onclick="delEntry('${ds}',${i},event)" aria-label="삭제">×</button>`;
    card.onclick=()=>card.classList.toggle('show-del');
    list.appendChild(card);
  });
}

function mainLabel(e) {
  if(e.cat==='med') return e.medName||(e.tags&&e.tags[0])||'약';
  if(e.cat==='sleep') return e.sleepStart&&e.sleepEnd?e.sleepStart+' – '+e.sleepEnd:'수면';
  if(e.cat==='supplement') return e.suppName||(e.tags&&e.tags[0])||'영양제';
  if(e.cat==='memo') return e.memoTitle||'메모';
  const tags=(e.tags||[]).concat(e.stateTags||[]).concat(e.symTags||[]);
  return tags.length>0 ? tags.slice(0,3).join(' · ') : (e.note||e.cat);
}

function delEntry(ds,idx,ev) {
  ev.stopPropagation();
  if(!confirm('이 기록을 삭제할까요?')) return;
  S.entries[ds].splice(idx,1);
  if(!S.entries[ds].length) delete S.entries[ds];
  save(); renderCards(ds); renderStrip();
}

/* ── 모달 ── */
function openModal(ds) {
  editDate = ds || selectedDate;
  document.getElementById('f-time').value = nowT();
  document.getElementById('modal-bg').classList.add('open');
  setCatById('med'); clearForm(); updateMedSelect();
}
function closeModal() { document.getElementById('modal-bg').classList.remove('open'); }
function bgClose(e) { if(e.target===document.getElementById('modal-bg')) closeModal(); }

function setCat(btn) {
  document.querySelectorAll('.cat-btn').forEach(b=>b.classList.remove('on'));
  btn.classList.add('on');
  currentCat=btn.dataset.cat;
  showFields(currentCat);
}
function setCatById(cat) {
  document.querySelectorAll('.cat-btn').forEach(b=>{ b.classList.remove('on'); if(b.dataset.cat===cat) b.classList.add('on'); });
  currentCat=cat; showFields(cat);
}
function showFields(cat) {
  ['med','symptom','mood','caffeine','sleep','cycle','supplement','memo'].forEach(c=>{
    document.getElementById('c-'+c).className='cond'+(c===cat?' show':'');
  });
}
function tpill(btn) { btn.classList.toggle('on'); }
function handleModalKey(e) {
  if(e.key!=='Enter') return;
  const active=document.activeElement;
  if(active&&active.id==='custom-symptom-input'){ e.preventDefault(); addCustomTag('p-symptom','custom-symptom-input'); }
  if(active&&active.id==='custom-mood-input'){ e.preventDefault(); addCustomTag('p-mood','custom-mood-input'); }
}
function addCustomTag(gridId, inputId) {
  const input = document.getElementById(inputId);
  const val = input.value.trim();
  if(!val) return;
  const grid = document.getElementById(gridId);
  // 이미 있는 태그면 그냥 활성화
  const existing = [...grid.querySelectorAll('.pill')].find(b=>b.textContent===val);
  if(existing){ existing.classList.add('on'); input.value=''; return; }
  const btn = document.createElement('button');
  btn.className='pill on custom-pill';
  btn.textContent=val;
  btn.onclick=()=>tpill(btn);
  grid.appendChild(btn);
  input.value='';
}
function tscale(btn,gid) { document.querySelectorAll('#'+gid+' .scale-btn').forEach(b=>b.classList.remove('on')); btn.classList.add('on'); }
function gscale(gid) { const s=document.querySelector('#'+gid+' .scale-btn.on'); return s?parseInt(s.textContent):null; }
function gpills(pid) { return [...document.querySelectorAll('#'+pid+' .pill.on')].map(b=>b.textContent); }
function clearForm() {
  // 커스텀 추가 태그 제거 후 기본 태그 초기화
  document.querySelectorAll('.custom-pill').forEach(b=>b.remove());
  document.querySelectorAll('.pill.on').forEach(b=>b.classList.remove('on'));
  document.querySelectorAll('.scale-btn.on').forEach(b=>b.classList.remove('on'));
  ['f-med-dose','f-symptom-note','f-mood-note','f-caf-note','f-sleep-note','f-cycle-note','f-supp-dose','f-supp-note','f-memo-title','f-memo-body','f-med-custom','f-supp-custom'].forEach(id=>{
    const el=document.getElementById(id); if(el) el.value='';
  });
  document.getElementById('f-sleep-start').value='23:00';
  document.getElementById('f-sleep-end').value='07:00';
}
function updateMedSelect() {
  const sel=document.getElementById('f-med-name'); sel.innerHTML='';
  (S.meds||[]).forEach(m=>{ const o=document.createElement('option'); o.value=m; o.textContent=m; sel.appendChild(o); });
  const oc=document.createElement('option'); oc.value='__custom__'; oc.textContent='+ 직접 입력'; sel.appendChild(oc);
  document.getElementById('med-custom-wrap').style.display='none';
  updateSuppSelect();
}
function updateSuppSelect() {
  const sel=document.getElementById('f-supp-name'); sel.innerHTML='';
  (S.supps||['비타민C','오메가3','마그네슘','비타민D','유산균']).forEach(m=>{ const o=document.createElement('option'); o.value=m; o.textContent=m; sel.appendChild(o); });
  const oc=document.createElement('option'); oc.value='__custom__'; oc.textContent='+ 직접 입력'; sel.appendChild(oc);
  document.getElementById('supp-custom-wrap').style.display='none';
}
function onMedChange(sel) {
  document.getElementById('med-custom-wrap').style.display = sel.value==='__custom__'?'block':'none';
}
function onSuppChange(sel) {
  document.getElementById('supp-custom-wrap').style.display = sel.value==='__custom__'?'block':'none';
}

function saveEntry() {
  const time=document.getElementById('f-time').value||nowT();
  let e={cat:currentCat, time};
  if(currentCat==='med'){
    const mv=document.getElementById('f-med-name').value;
    e.medName=mv==='__custom__'?document.getElementById('f-med-custom').value:mv;
    e.dose=document.getElementById('f-med-dose').value;
  } else if(currentCat==='symptom'){
    e.tags=gpills('p-symptom'); e.intensity=gscale('s-intensity'); e.note=document.getElementById('f-symptom-note').value;
    e.sub=e.tags.join(' · ')+(e.intensity?' (강도 '+e.intensity+')':'');
  } else if(currentCat==='mood'){
    e.tags=gpills('p-mood'); e.scale=gscale('s-mood'); e.note=document.getElementById('f-mood-note').value;
    e.sub=e.tags.join(' · ')+(e.scale?' (강도 '+e.scale+')':'');
  } else if(currentCat==='caffeine'){
    e.tags=gpills('p-caf'); e.note=document.getElementById('f-caf-note').value;
  } else if(currentCat==='sleep'){
    e.sleepStart=document.getElementById('f-sleep-start').value;
    e.sleepEnd=document.getElementById('f-sleep-end').value;
    e.quality=gscale('s-sleep'); e.note=document.getElementById('f-sleep-note').value;
  } else if(currentCat==='cycle'){
    e.stateTags=gpills('p-cycle-state'); e.symTags=gpills('p-cycle-sym'); e.note=document.getElementById('f-cycle-note').value;
    e.tags=[...e.stateTags,...e.symTags];
  } else if(currentCat==='supplement'){
    const sv=document.getElementById('f-supp-name').value;
    e.suppName=sv==='__custom__'?document.getElementById('f-supp-custom').value:sv;
    e.dose=document.getElementById('f-supp-dose').value;
    e.note=document.getElementById('f-supp-note').value;
  } else if(currentCat==='memo'){
    e.memoTitle=document.getElementById('f-memo-title').value||'메모';
    e.note=document.getElementById('f-memo-body').value;
  }
  if(!S.entries[editDate]) S.entries[editDate]=[];
  S.entries[editDate].push(e);
  S.entries[editDate].sort((a,b)=>a.time.localeCompare(b.time));
  save(); closeModal();
  if(document.getElementById('sec-home').classList.contains('active')){ renderStrip(); renderCards(editDate); }
  if(document.getElementById('sec-cal').classList.contains('active')){ renderCal(); renderCalDetail(editDate); }
}

/* ── 달력 ── */
function initCal() { if(!calY){ const d=new Date(); calY=d.getFullYear(); calM=d.getMonth(); } }
function prevMonth() { calM--; if(calM<0){calM=11;calY--;} renderCal(); }
function nextMonth() { calM++; if(calM>11){calM=0;calY++;} renderCal(); }

function renderCal() {
  document.getElementById('cal-title').textContent = calY+'년 '+(calM+1)+'월';
  const grid=document.getElementById('cal-grid');
  grid.innerHTML='';
  ['일','월','화','수','목','금','토'].forEach(d=>{ const el=document.createElement('div'); el.className='cal-dow'; el.textContent=d; grid.appendChild(el); });
  const first=new Date(calY,calM,1).getDay();
  const daysIn=new Date(calY,calM+1,0).getDate();
  const t=today();
  for(let i=0;i<first;i++){ const el=document.createElement('div'); el.className='cal-day empty'; grid.appendChild(el); }
  for(let d=1;d<=daysIn;d++){
    const ds=calY+'-'+p(calM+1)+'-'+p(d);
    const el=document.createElement('div');
    let cls='cal-day';
    if(ds===t) cls+=' today';
    if(ds===selectedDate&&ds!==t) cls+=' selected';
    if(S.entries[ds]&&S.entries[ds].length) cls+=' has-entry';
    if(isMenstrual(ds)) cls+=' menstrual';
    el.className=cls; el.textContent=d;
    el.onclick=()=>{ selectedDate=ds; editDate=ds; renderCal(); renderCalDetail(ds); };
    grid.appendChild(el);
  }
}

function renderCalDetail(ds) {
  const parts=ds.split('-');
  document.getElementById('cal-detail-label').textContent=parseInt(parts[1])+'월 '+parseInt(parts[2])+'일';
  const list=document.getElementById('cal-detail-list');
  list.innerHTML='';
  const entries=S.entries[ds]||[];
  if(!entries.length){ list.innerHTML='<div style="font-size:12px;color:var(--ink3);padding:8px 0;">기록 없음</div>'; return; }
  const catNames={med:'약',symptom:'증상',mood:'감정',caffeine:'카페인',sleep:'수면',cycle:'생리'};
  entries.forEach((e,i)=>{
    const ref=lastMed(entries,i);
    let elHtml='';
    if(e.cat!=='med'&&ref){ const diff=toMin(e.time)-toMin(ref.time); const b=fmtElapsed(diff); if(b) elHtml=` <span style="font-size:10px;font-weight:500;background:var(--amber-bg);color:var(--amber);border-radius:8px;padding:1px 6px;margin-left:4px;">${b}${dayOffset>0?" (전날)":""}</span>`; }
    const row=document.createElement('div');
    row.style.cssText='display:flex;align-items:flex-start;gap:8px;padding:5px 0;border-bottom:0.5px solid var(--ink4);';
    row.innerHTML=`<span style="font-size:10px;color:var(--ink3);min-width:30px;padding-top:1px;">${e.time}</span><div style="width:2px;border-radius:2px;background:var(--${e.cat==='med'?'green':e.cat==='mood'?'amber':e.cat==='caffeine'?'brown':e.cat==='symptom'?'red':e.cat==='sleep'?'blue':e.cat==='supplement'?'blue':e.cat==='memo'?'ink3':'pink'});align-self:stretch;flex-shrink:0;min-height:16px;"></div><div style="flex:1;"><div style="font-size:10px;color:var(--ink3);">${catNames[e.cat]||''}</div><div style="font-size:12px;font-weight:500;">${mainLabel(e)}${elHtml}</div></div>`;
    list.appendChild(row);
  });
  const addBtn=document.createElement('button');
  addBtn.className='fab'; addBtn.style.cssText='margin-top:10px;padding:10px;font-size:13px;';
  addBtn.innerHTML='<i class="ti ti-plus" aria-hidden="true"></i> 이 날에 기록 추가';
  addBtn.onclick=()=>openModal(ds);
  list.appendChild(addBtn);
}

function isMenstrual(ds) {
  if(!S.cycleStart) return false;
  const start=new Date(S.cycleStart+'T00:00:00');
  const d=new Date(ds+'T00:00:00');
  const diff=Math.round((d-start)/(1000*60*60*24));
  const pos=((diff%S.cycleLen)+S.cycleLen)%S.cycleLen;
  return pos<6;
}
function getCycleDay(ds) {
  if(!S.cycleStart) return null;
  const start=new Date(S.cycleStart+'T00:00:00');
  const d=new Date(ds+'T00:00:00');
  const diff=Math.round((d-start)/(1000*60*60*24));
  const pos=((diff%S.cycleLen)+S.cycleLen)%S.cycleLen;
  return pos+1; // 1-based 일수
}
function getCyclePhase(ds) {
  if(!S.cycleStart) return null;
  const start=new Date(S.cycleStart+'T00:00:00');
  const d=new Date(ds+'T00:00:00');
  const diff=Math.round((d-start)/(1000*60*60*24));
  const pos=((diff%S.cycleLen)+S.cycleLen)%S.cycleLen;
  const day=pos+1;
  const len=S.cycleLen||28;
  const ovulation=Math.round(len/2);
  if(day<=5) return '🩸 생리중';
  if(day<=ovulation-3) return '🌱 난포기';
  if(day<=ovulation+2) return '🌸 배란기';
  if(day<=len-5) return '🌙 황체기';
  return '⚡ PMS';
}
function getCycleLabel(ds) {
  const day=getCycleDay(ds);
  const phase=getCyclePhase(ds);
  if(!day) return null;
  return `D+${day}  ${phase}`;
}

/* ── 분석 ── */
function renderStats() {
  const body=document.getElementById('stats-body');
  body.innerHTML='';
  const days=[];
  for(let i=6;i>=0;i--){ const d=new Date(); d.setDate(d.getDate()-i); days.push(fmt(d)); }
  let medCnt=0, moodTags=[], symTags=[], cafCnt=0, sleepQuals=[];
  days.forEach(ds=>{
    (S.entries[ds]||[]).forEach(e=>{
      if(e.cat==='med') medCnt++;
      if(e.cat==='mood') moodTags.push(...(e.tags||[]));
      if(e.cat==='symptom') symTags.push(...(e.tags||[]));
      if(e.cat==='caffeine') cafCnt++;
      if(e.cat==='sleep'&&e.quality) sleepQuals.push(e.quality);
    });
  });
  const avgSleep=sleepQuals.length?Math.round(sleepQuals.reduce((a,b)=>a+b,0)/sleepQuals.length*10)/10:null;
  const moodFreq=freq(moodTags), symFreq=freq(symTags);
  const dayLabels=['7일전','6일전','5일전','4일전','3일전','2일전','오늘'];
  const moodCounts=days.map(ds=>(S.entries[ds]||[]).filter(e=>e.cat==='mood').length);
  const maxM=Math.max(...moodCounts,1);

  body.innerHTML=`
    <div class="stat-card">
      <div class="stat-card-title">💊 7일 복용 횟수</div>
      <div><span class="stat-num">${medCnt}</span><span class="stat-unit">회</span></div>
    </div>
    <div class="stat-card">
      <div class="stat-card-title">💭 자주 나타난 감정</div>
      ${moodFreq.length?`<div class="tag-cloud">${moodFreq.slice(0,8).map(([k,v])=>`<span class="tag tag-mood">${k} <span style="opacity:.6">${v}</span></span>`).join('')}</div>`:'<div class="empty-tags">기록 없음</div>'}
    </div>
    <div class="stat-card">
      <div class="stat-card-title">🩹 자주 나타난 증상</div>
      ${symFreq.length?`<div class="tag-cloud">${symFreq.slice(0,8).map(([k,v])=>`<span class="tag tag-symptom">${k} <span style="opacity:.6">${v}</span></span>`).join('')}</div>`:'<div class="empty-tags">기록 없음</div>'}
    </div>
    <div class="stat-card">
      <div class="stat-card-title">☕ 카페인 섭취</div>
      <div><span class="stat-num">${cafCnt}</span><span class="stat-unit">회 / 7일</span></div>
    </div>
    ${avgSleep!==null?`<div class="stat-card"><div class="stat-card-title">🌙 평균 수면 질</div><div><span class="stat-num">${avgSleep}</span><span class="stat-unit">/ 5</span></div></div>`:''}
    <div class="stat-card">
      <div class="stat-card-title">💭 감정 기록 빈도 (일별)</div>
      <div class="chart-bar-wrap">${days.map((ds,i)=>`<div class="chart-row"><span class="chart-row-label">${dayLabels[i]}</span><div class="chart-bar-bg"><div class="chart-bar-fill" style="width:${Math.round(moodCounts[i]/maxM*100)}%"></div></div><span class="chart-row-val">${moodCounts[i]}</span></div>`).join('')}</div>
    </div>`;
}

function freq(arr){const m={}; arr.forEach(k=>{m[k]=(m[k]||0)+1;}); return Object.entries(m).sort((a,b)=>b[1]-a[1]);}

/* ── 설정 ── */
function renderSetting() {
  const list=document.getElementById('med-list'); list.innerHTML='';
  (S.meds||[]).forEach((m,i)=>{
    const row=document.createElement('div'); row.className='med-row';
    row.innerHTML=`<i class="ti ti-pill" style="font-size:14px;color:var(--green)" aria-hidden="true"></i><span>${m}</span><button onclick="delMed(${i})" aria-label="삭제">×</button>`;
    list.appendChild(row);
  });
  const slist=document.getElementById('supp-list'); slist.innerHTML='';
  (S.supps||[]).forEach((m,i)=>{
    const row=document.createElement('div'); row.className='med-row';
    row.innerHTML=`<i class="ti ti-leaf" style="font-size:14px;color:var(--blue)" aria-hidden="true"></i><span>${m}</span><button onclick="delSupp(${i})" aria-label="삭제">×</button>`;
    slist.appendChild(row);
  });
  if(S.cycleStart) document.getElementById('cycle-start').value=S.cycleStart;
  document.getElementById('cycle-len').value=S.cycleLen||28;
}
function addMed(){ const v=document.getElementById('med-input').value.trim(); if(!v)return; S.meds.push(v); document.getElementById('med-input').value=''; save(); renderSetting(); }
function delMed(i){ S.meds.splice(i,1); save(); renderSetting(); }
function addSupp(){ const v=document.getElementById('supp-input').value.trim(); if(!v)return; if(!S.supps)S.supps=[]; S.supps.push(v); document.getElementById('supp-input').value=''; save(); renderSetting(); }
function delSupp(i){ S.supps.splice(i,1); save(); renderSetting(); }
function saveCycle(){
  S.cycleStart=document.getElementById('cycle-start').value;
  S.cycleLen=parseInt(document.getElementById('cycle-len').value)||28;
  save(); alert('저장됐어요!');
  if(document.getElementById('sec-cal').classList.contains('active')) renderCal();
}

/* ── 백업 ── */
function exportData(){
  const blob=new Blob([JSON.stringify(S,null,2)],{type:'application/json'});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a'); a.href=url; a.download='복용기록_'+today()+'.json'; a.click(); URL.revokeObjectURL(url);
}
function importData(input){
  const file=input.files[0]; if(!file) return;
  const reader=new FileReader();
  reader.onload=e=>{ try{ const data=JSON.parse(e.target.result); if(data.entries){ S=data; save(); alert('복구됐어요!'); renderHome(); }else{alert('올바른 파일이 아니에요.');} }catch(err){alert('파일을 읽을 수 없어요.');} };
  reader.readAsText(file);
}
function clearAll(){
  if(confirm('모든 기록을 삭제할까요? 되돌릴 수 없어요.')){ const m=S.meds; S=def(); S.meds=m; save(); renderHome(); alert('초기화됐어요.'); }
}

/* ── 초기화 ── */
renderHome();
const _d=new Date(); calY=_d.getFullYear(); calM=_d.getMonth();
</script>
